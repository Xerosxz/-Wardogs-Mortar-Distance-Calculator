<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือคำนวณระยะทางพิกัด (Mortar & Multi-Target)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 flex flex-col justify-between">
    
    <div class="max-w-4xl mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-crosshair text-amber-500"></i>
                คำนวณพิกัด Mortar Multi-Target
            </h1>
            <p class="text-slate-400 text-sm">
                สูตร: <span class="text-amber-300 font-mono font-semibold">√[(X₁-X₂)² + (Y₁-Y₂)²] × 100</span>
            </p>
        </header>

        <!-- Base Point (Mortar) -->
        <div class="bg-slate-800 border-2 border-amber-500/40 rounded-2xl p-5 shadow-xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                <div class="flex items-center gap-2">
                    <span class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-md text-xs">จุดอ้างอิงหลัก</span>
                    <h2 class="text-lg font-bold text-amber-400">พิกัด Mortar (จุดที่ 1)</h2>
                </div>
                <button onclick="clearMortar()" class="text-xs text-slate-400 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-rotate-left mr-1"></i>รีเซ็ต
                </button>
            </div>

            <!-- Mortar Fast Paste -->
            <div class="relative">
                <input type="text" id="mortarPaste" placeholder="วางพิกัด Mortar รวดเร็ว เช่น x98.43, y110.38" 
                    oninput="handleMortarPaste(this.value)"
                    class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-amber-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
                <i class="fa-solid fa-bolt absolute right-3 top-3 text-amber-500/50"></i>
            </div>

            <!-- Mortar Inputs -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">X1 (Mortar)</label>
                    <input type="number" step="any" id="x1" placeholder="0.00" oninput="calculateAll()"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Y1 (Mortar)</label>
                    <input type="number" step="any" id="y1" placeholder="0.00" oninput="calculateAll()"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-500">
                </div>
            </div>
        </div>

        <!-- Targets List Header & Add Button -->
        <div class="flex items-center justify-between pt-2">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                <i class="fa-solid fa-bullseye text-red-400"></i>
                รายการจุดเป้าหมาย (Targets)
            </h2>
            <button onclick="addTarget()" 
                class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-xl flex items-center gap-2 shadow-lg hover:shadow-emerald-900/40 transition-all">
                <i class="fa-solid fa-plus"></i>
                เพิ่มจุดเป้าหมาย
            </button>
        </div>

        <!-- Targets Container -->
        <div id="targetsContainer" class="space-y-4">
            <!-- Dynamic Targets Will Be Inserted Here -->
        </div>
    </div>

    <footer class="text-center text-xs text-slate-600 mt-8">
        เครื่องมือคำนวณระยะทางแบบหลายจุด • พร้อมใช้งานบนเว็บ
    </footer>

    <script>
        let targetIdCounter = 0;

        // Auto add 1 initial target on load
        window.onload = function() {
            addTarget();
        };

        function parseCoordinates(text) {
            if (!text) return null;
            let x = null, y = null;

            // Pattern: x98.43, y110.38
            const matchX = text.match(/x\s*[:=]?\s*(-?\d+\.?\d*)/i);
            const matchY = text.match(/y\s*[:=]?\s*(-?\d+\.?\d*)/i);

            if (matchX && matchY) {
                x = parseFloat(matchX[1]);
                y = parseFloat(matchY[1]);
            } else {
                const numbers = text.match(/-?\d+\.?\d*/g);
                if (numbers && numbers.length >= 2) {
                    x = parseFloat(numbers[0]);
                    y = parseFloat(numbers[1]);
                }
            }

            return (x !== null && y !== null && !isNaN(x) && !isNaN(y)) ? { x, y } : null;
        }

        function handleMortarPaste(val) {
            const coords = parseCoordinates(val);
            if (coords) {
                document.getElementById('x1').value = coords.x;
                document.getElementById('y1').value = coords.y;
                calculateAll();
            }
        }

        function clearMortar() {
            document.getElementById('x1').value = '';
            document.getElementById('y1').value = '';
            document.getElementById('mortarPaste').value = '';
            calculateAll();
        }

        function addTarget() {
            targetIdCounter++;
            const id = targetIdCounter;
            const container = document.getElementById('targetsContainer');

            const card = document.createElement('div');
            card.id = `target-card-${id}`;
            card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 md:p-5 shadow-lg space-y-4 transition-all hover:border-slate-600";
            
            card.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
                    <div class="flex items-center gap-2">
                        <span class="bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded text-xs">#${id}</span>
                        <h3 class="font-semibold text-slate-200 text-sm md:text-base">จุดเป้าหมาย Target ${id}</h3>
                    </div>
                    <button onclick="removeTarget(${id})" class="text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 px-2.5 py-1 rounded-lg transition-colors">
                        <i class="fa-solid fa-trash-can mr-1"></i>ลบ
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <!-- Inputs Left (7 cols) -->
                    <div class="md:col-span-7 space-y-3">
                        <div class="relative">
                            <input type="text" id="paste-${id}" placeholder="วางพิกัดรวดเร็ว เช่น x120.5, y80.2" 
                                oninput="handleTargetPaste(${id}, this.value)"
                                class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">X₂</label>
                                <input type="number" step="any" id="x2-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-cyan-500">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Y₂</label>
                                <input type="number" step="any" id="y2-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                    class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-cyan-500">
                            </div>
                        </div>
                    </div>

                    <!-- Output Right (5 cols) -->
                    <div class="md:col-span-5 bg-slate-950/80 rounded-xl p-3.5 border border-slate-800 flex flex-col justify-between">
                        <div>
                            <div class="text-xs text-slate-400 mb-1">ผลลัพธ์คำนวณ</div>
                            <div id="result-${id}" class="text-xl md:text-2xl font-bold font-mono text-cyan-400 truncate">
                                0.00
                            </div>
                            <div id="step-${id}" class="text-[11px] text-slate-500 font-mono mt-1 truncate">
                                รอระบุพิกัด...
                            </div>
                        </div>
                        <button onclick="copyResult(${id})" id="btn-copy-${id}" disabled
                            class="mt-3 w-full bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:hover:bg-slate-800 text-xs py-1.5 px-3 rounded-lg flex items-center justify-center gap-1.5 transition-colors">
                            <i class="fa-regular fa-copy"></i>
                            <span id="copy-text-${id}">ก๊อปปี้ผลลัพธ์</span>
                        </button>
                    </div>
                </div>
            `;

            container.appendChild(card);
            calculateTarget(id);
        }

        function removeTarget(id) {
            const card = document.getElementById(`target-card-${id}`);
            if (card) {
                card.remove();
            }
        }

        function handleTargetPaste(id, val) {
            const coords = parseCoordinates(val);
            if (coords) {
                document.getElementById(`x2-${id}`).value = coords.x;
                document.getElementById(`y2-${id}`).value = coords.y;
                calculateTarget(id);
            }
        }

        function calculateTarget(id) {
            const x1 = parseFloat(document.getElementById('x1').value);
            const y1 = parseFloat(document.getElementById('y1').value);
            const x2 = parseFloat(document.getElementById(`x2-${id}`).value);
            const y2 = parseFloat(document.getElementById(`y2-${id}`).value);

            const resEl = document.getElementById(`result-${id}`);
            const stepEl = document.getElementById(`step-${id}`);
            const copyBtn = document.getElementById(`btn-copy-${id}`);

            if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
                resEl.innerText = "0.00";
                resEl.className = "text-xl md:text-2xl font-bold font-mono text-slate-600";
                stepEl.innerText = "กรอกพิกัด Mortar และ Target ให้ครบถ้วน";
                copyBtn.disabled = true;
                return;
            }

            const dx = x1 - x2;
            const dy = y1 - y2;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const finalResult = dist * 100;

            resEl.innerText = finalResult.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
            resEl.className = "text-xl md:text-2xl font-bold font-mono text-emerald-400";
            stepEl.innerText = `√[(${dx.toFixed(2)})² + (${dy.toFixed(2)})²] × 100`;
            copyBtn.disabled = false;
        }

        function calculateAll() {
            const targets = document.querySelectorAll('[id^="target-card-"]');
            targets.forEach(target => {
                const id = target.id.replace('target-card-', '');
                calculateTarget(id);
            });
        }

        function copyResult(id) {
            const resText = document.getElementById(`result-${id}`).innerText.replace(/,/g, '');
            navigator.clipboard.writeText(resText).then(() => {
                const label = document.getElementById(`copy-text-${id}`);
                label.innerText = "คัดลอกแล้ว!";
                setTimeout(() => {
                    label.innerText = "ก๊อปปี้ผลลัพธ์";
                }, 1500);
            });
        }
    </script>
</body>
</html>
