<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เครื่องมือคำนวณระยะทางและ MIL พิกัด (Mortar & Arty Multi-Target)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-8 px-4 flex flex-col justify-between">
    
    <div class="max-w-4xl mx-auto w-full space-y-6">
        <!-- Header -->
        <header class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-amber-400 flex items-center justify-center gap-2">
                <i class="fa-solid fa-crosshair text-amber-500"></i>
                คำนวณพิกัด & MIL Multi-Target
            </h1>
            <p class="text-slate-400 text-sm">
                สูตรระยะทาง: <span class="text-amber-300 font-mono font-semibold">√[(X₁-X₂)² + (Y₁-Y₂)²] × 100</span>
            </p>
        </header>

        <!-- Base Point (Base Coordinate) -->
        <div id="base-card" class="bg-slate-800 border-2 border-amber-500/40 rounded-2xl p-5 shadow-xl space-y-4 transition-all">
            <div class="flex items-center justify-between border-b border-slate-700 pb-3">
                <div class="flex items-center gap-2">
                    <span id="base-badge" class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-md text-xs">จุดอ้างอิงหลัก</span>
                    <h2 id="base-title" class="text-lg font-bold text-amber-400">พิกัด Mortar (จุดที่ 1)</h2>
                </div>
                <button onclick="clearMortar()" class="text-xs text-slate-400 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-rotate-left mr-1"></i>รีเซ็ต
                </button>
            </div>

            <!-- Fast Paste -->
            <div class="relative">
                <input type="text" id="mortarPaste" placeholder="วางพิกัดจุดหลักรวดเร็ว เช่น x98.43, y110.38" 
                    oninput="handleMortarPaste(this.value)"
                    class="w-full bg-slate-950/80 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-amber-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all">
                <i class="fa-solid fa-bolt absolute right-3 top-3 text-amber-500/50"></i>
            </div>

            <!-- Inputs -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label id="label-x1" class="block text-xs font-medium text-slate-400 mb-1">X1 (Mortar)</label>
                    <input type="number" step="any" id="x1" placeholder="0.00" oninput="calculateAll()"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label id="label-y1" class="block text-xs font-medium text-slate-400 mb-1">Y1 (Mortar)</label>
                    <input type="number" step="any" id="y1" placeholder="0.00" oninput="calculateAll()"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono focus:outline-none focus:border-amber-500">
                </div>
            </div>
        </div>

        <!-- Targets List Header & Mode Switcher -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 pt-2">
            <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 shrink-0">
                <i class="fa-solid fa-bullseye text-red-400"></i>
                รายการจุดเป้าหมาย
            </h2>

            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                <!-- Mode Switcher -->
                <div class="bg-slate-800/90 border border-slate-700/80 rounded-xl p-1 flex items-center gap-1 shadow-md">
                    <button id="mode-mortar-btn" onclick="setMode('mortar')" 
                        class="py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all bg-amber-500 text-slate-950 shadow">
                        <i class="fa-solid fa-bullseye"></i>
                        Mortar
                    </button>
                    <button id="mode-arty-btn" onclick="setMode('arty')" 
                        class="py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all text-slate-400 hover:text-slate-200">
                        <i class="fa-solid fa-explosion"></i>
                        Arty (วิเคราะห์กระสุนตก)
                    </button>
                </div>

                <!-- Add Button -->
                <button onclick="addTarget()" 
                    class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-xl flex items-center gap-1.5 shadow-lg hover:shadow-emerald-900/40 transition-all shrink-0">
                    <i class="fa-solid fa-plus"></i>
                    เพิ่มเป้าหมาย
                </button>
            </div>
        </div>

        <!-- Targets Container -->
        <div id="targetsContainer" class="space-y-4">
            <!-- Dynamic Targets Will Be Inserted Here -->
        </div>
    </div>

    <footer class="text-center text-xs text-slate-600 mt-8">
        เครื่องมือคำนวณระยะทางแบบหลายจุด • รองรับระยะยิงจริงเพื่อคำนวณปรับยิง
    </footer>

    <script>
        let currentMode = 'mortar';
        let activeTargetIds = new Set();

        const REF_DIST = 2216;
        const REF_MIL = 970;

        window.onload = function() {
            addTarget();
        };

        function setMode(mode) {
            currentMode = mode;
            const mortarBtn = document.getElementById('mode-mortar-btn');
            const artyBtn = document.getElementById('mode-arty-btn');
            const baseCard = document.getElementById('base-card');
            const baseTitle = document.getElementById('base-title');
            const baseBadge = document.getElementById('base-badge');
            const labelX1 = document.getElementById('label-x1');
            const labelY1 = document.getElementById('label-y1');

            if (mode === 'mortar') {
                mortarBtn.className = "py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all bg-amber-500 text-slate-950 shadow";
                artyBtn.className = "py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all text-slate-400 hover:text-slate-200";
                
                baseCard.className = "bg-slate-800 border-2 border-amber-500/40 rounded-2xl p-5 shadow-xl space-y-4 transition-all";
                baseTitle.className = "text-lg font-bold text-amber-400";
                baseTitle.innerText = "พิกัด Mortar (จุดที่ 1)";
                baseBadge.className = "bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-md text-xs";
                labelX1.innerText = "X1 (Mortar)";
                labelY1.innerText = "Y1 (Mortar)";
            } else {
                artyBtn.className = "py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all bg-orange-600 text-white shadow";
                mortarBtn.className = "py-1.5 px-3 rounded-lg font-semibold text-xs flex items-center gap-1.5 transition-all text-slate-400 hover:text-slate-200";
                
                baseCard.className = "bg-slate-800 border-2 border-orange-500/40 rounded-2xl p-5 shadow-xl space-y-4 transition-all";
                baseTitle.className = "text-lg font-bold text-orange-400";
                baseTitle.innerText = "พิกัด Arty (จุดที่ 1)";
                baseBadge.className = "bg-orange-600 text-white font-bold px-2.5 py-1 rounded-md text-xs";
                labelX1.innerText = "X1 (Arty)";
                labelY1.innerText = "Y1 (Arty)";
            }

            activeTargetIds.forEach(id => {
                const impactSection = document.getElementById(`impact-section-${id}`);
                if (impactSection) {
                    if (mode === 'arty') {
                        impactSection.classList.remove('hidden');
                    } else {
                        impactSection.classList.add('hidden');
                    }
                }
            });

            calculateAll();
        }

        function getNextAvailableId() {
            let id = 1;
            while (activeTargetIds.has(id)) {
                id++;
            }
            return id;
        }

        function parseCoordinates(text) {
            if (!text) return null;
            let x = null, y = null;

            const matchX = text.match(/x\s*[:=]?\s*(-?\d+\.?\d*)/i);
            const matchY = text.match(/y\s*[:=]?\s*(-?\d+\.?\d*)/i);

            if (matchX && matchY) {
                x = parseFloat(matchX[1]);
                y = parseFloat(matchY[1]);
            } else {
                const numbers = text.match(/-?\d+\.?\d*/g);
                if (numbers && numbers.length >= 2) {
                    x = parseFloat(numbers[0]);
                    y = parseFloat(numbers[1]);
                }
            }

            return (x !== null && y !== null && !isNaN(x) && !isNaN(y)) ? { x, y } : null;
        }

        function handleMortarPaste(val) {
            const coords = parseCoordinates(val);
            if (coords) {
                document.getElementById('x1').value = coords.x;
                document.getElementById('y1').value = coords.y;
                calculateAll();
            }
        }

        function clearMortar() {
            document.getElementById('x1').value = '';
            document.getElementById('y1').value = '';
            document.getElementById('mortarPaste').value = '';
            calculateAll();
        }

        function addTarget() {
            const id = getNextAvailableId();
            activeTargetIds.add(id);

            const container = document.getElementById('targetsContainer');
            const card = document.createElement('div');
            card.id = `target-card-${id}`;
            card.className = "bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 md:p-5 shadow-lg space-y-4 transition-all hover:border-slate-600";
            
            card.innerHTML = `
                <div class="flex items-center justify-between border-b border-slate-700/60 pb-3 gap-2">
                    <div class="flex items-center gap-2 flex-grow">
                        <span class="bg-slate-700 text-slate-300 font-bold px-2 py-0.5 rounded text-xs shrink-0">#${id}</span>
                        <input type="text" id="name-${id}" placeholder="ตำแหน่งที่ ${id}"
                            class="bg-transparent text-slate-200 font-semibold text-sm md:text-base border-b border-transparent hover:border-slate-600 focus:border-cyan-500 focus:outline-none px-1 py-0.5 w-full transition-all" />
                    </div>
                    <button onclick="removeTarget(${id})" class="text-xs text-red-400 hover:text-red-300 hover:bg-red-500/10 px-2.5 py-1 rounded-lg transition-colors shrink-0">
                        <i class="fa-solid fa-trash-can mr-1"></i>ลบ
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <!-- Inputs Left (7 cols) -->
                    <div class="md:col-span-7 space-y-3">
                        <div>
                            <div class="text-xs text-cyan-400 font-semibold mb-1">พิกัดเป้าหมายยิง (Target)</div>
                            <div class="relative mb-2">
                                <input type="text" id="paste-${id}" placeholder="วางพิกัดรวดเร็ว เช่น x120.5, y80.2" 
                                    oninput="handleTargetPaste(${id}, this.value)"
                                    class="w-full bg-slate-950/60 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500">
                            </div>
                            <div class="grid grid-cols-3 gap-2">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">X₂ (เป้าหมาย)</label>
                                    <input type="number" step="any" id="x2-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm text-white font-mono focus:outline-none focus:border-cyan-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Y₂ (เป้าหมาย)</label>
                                    <input type="number" step="any" id="y2-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-2.5 py-2 text-sm text-white font-mono focus:outline-none focus:border-cyan-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-amber-400 font-medium mb-1 truncate">ระยะยิงจริง (m)</label>
                                    <input type="number" step="any" id="fired-dist-${id}" placeholder="ออโต้" oninput="calculateTarget(${id})"
                                        class="w-full bg-slate-900 border border-amber-500/40 rounded-xl px-2.5 py-2 text-sm text-amber-300 font-mono focus:outline-none focus:border-amber-500">
                                </div>
                            </div>
                        </div>

                        <!-- Arty Impact Point Inputs (Hidden in Mortar Mode) -->
                        <div id="impact-section-${id}" class="${currentMode === 'arty' ? '' : 'hidden'} border-t border-slate-700/60 pt-3 space-y-2">
                            <div class="text-xs text-orange-400 font-semibold">พิกัดกระสุนตกจริง (Impact / Splash Point)</div>
                            <div class="relative">
                                <input type="text" id="impact-paste-${id}" placeholder="วางพิกัดกระสุนตกรวดเร็ว" 
                                    oninput="handleImpactPaste(${id}, this.value)"
                                    class="w-full bg-slate-950/60 border border-orange-500/30 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">X (กระสุนตก)</label>
                                    <input type="number" step="any" id="xi-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-orange-500">
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Y (กระสุนตก)</label>
                                    <input type="number" step="any" id="yi-${id}" placeholder="0.00" oninput="calculateTarget(${id})"
                                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-orange-500">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Output Right (5 cols) -->
                    <div class="md:col-span-5 bg-slate-950/80 rounded-xl p-3.5 border border-slate-800 flex flex-col justify-between">
                        <div class="space-y-2">
                            <div class="grid grid-cols-2 gap-2 border-b border-slate-800 pb-2">
                                <div>
                                    <div class="text-[11px] text-slate-400">ระยะเป้าหมาย</div>
                                    <div id="result-${id}" class="text-lg md:text-xl font-bold font-mono text-cyan-400 truncate">
                                        0.00 <span class="text-xs font-normal text-slate-500">m</span>
                                    </div>
                                </div>
                                <div>
                                    <div class="text-[11px] text-amber-400 font-semibold">มุมยิง (MIL)</div>
                                    <div id="mil-${id}" class="text-lg md:text-xl font-bold font-mono text-amber-300 truncate">
                                        0 <span class="text-xs font-normal text-slate-500">mils</span>
                                    </div>
                                </div>
                            </div>

                            <div id="step-${id}" class="text-[11px] text-slate-500 font-mono truncate">
                                รอระบุพิกัด...
                            </div>

                            <!-- Correction Box (Arty Mode) -->
                            <div id="corr-box-${id}" class="hidden bg-slate-900 border border-orange-500/40 rounded-lg p-2.5 space-y-1.5">
                                <div class="text-[11px] font-semibold text-orange-400 flex items-center gap-1">
                                    <i class="fa-solid fa-compass"></i> คำแนะนำการปรับยิง
                                </div>
                                <div id="corr-dist-${id}" class="text-xs font-bold text-slate-100 leading-relaxed">
                                    -
                                </div>
                                <div id="corr-dir-${id}" class="text-xs font-bold text-slate-100 flex items-center gap-2">
                                    -
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-3">
                            <button onclick="copyResult(${id})" id="btn-copy-${id}" disabled
                                class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 disabled:opacity-40 disabled:hover:bg-slate-800 text-[11px] py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
                                <i class="fa-regular fa-copy"></i>
                                <span id="copy-text-${id}">ก๊อประยะ</span>
                            </button>
                            <button onclick="copyMil(${id})" id="btn-copy-mil-${id}" disabled
                                class="w-full bg-amber-900/40 hover:bg-amber-800/60 text-amber-200 border border-amber-600/30 disabled:opacity-40 text-[11px] py-1.5 px-2 rounded-lg flex items-center justify-center gap-1 transition-colors">
                                <i class="fa-solid fa-crosshair"></i>
                                <span id="copy-mil-text-${id}">ก๊อป MIL</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            container.appendChild(card);
            calculateTarget(id);
        }

        function removeTarget(id) {
            const card = document.getElementById(`target-card-${id}`);
            if (card) {
                card.remove();
                activeTargetIds.delete(id);
            }
        }

        function handleTargetPaste(id, val) {
            const coords = parseCoordinates(val);
            if (coords) {
                document.getElementById(`x2-${id}`).value = coords.x;
                document.getElementById(`y2-${id}`).value = coords.y;
                calculateTarget(id);
            }
        }

        function handleImpactPaste(id, val) {
            const coords = parseCoordinates(val);
            if (coords) {
                document.getElementById(`xi-${id}`).value = coords.x;
                document.getElementById(`yi-${id}`).value = coords.y;
                calculateTarget(id);
            }
        }

        function calculateTarget(id) {
            const x1 = parseFloat(document.getElementById('x1').value);
            const y1 = parseFloat(document.getElementById('y1').value);
            const x2 = parseFloat(document.getElementById(`x2-${id}`).value);
            const y2 = parseFloat(document.getElementById(`y2-${id}`).value);

            const resEl = document.getElementById(`result-${id}`);
            const milEl = document.getElementById(`mil-${id}`);
            const stepEl = document.getElementById(`step-${id}`);
            const copyBtn = document.getElementById(`btn-copy-${id}`);
            const copyMilBtn = document.getElementById(`btn-copy-mil-${id}`);
            const corrBox = document.getElementById(`corr-box-${id}`);
            const corrDistEl = document.getElementById(`corr-dist-${id}`);
            const corrDirEl = document.getElementById(`corr-dir-${id}`);

            if (isNaN(x1) || isNaN(y1) || isNaN(x2) || isNaN(y2)) {
                resEl.innerHTML = `0.00 <span class="text-xs font-normal text-slate-500">m</span>`;
                milEl.innerHTML = `0 <span class="text-xs font-normal text-slate-500">mils</span>`;
                resEl.className = "text-lg md:text-xl font-bold font-mono text-slate-600";
                stepEl.innerText = "กรอกพิกัดจุดหลักและ Target ให้ครบถ้วน";
                copyBtn.disabled = true;
                copyMilBtn.disabled = true;
                if (corrBox) corrBox.classList.add('hidden');
                return;
            }

            const dx = x1 - x2;
            const dy = y1 - y2;
            const calculatedTargetDist = Math.sqrt(dx * dx + dy * dy) * 100;
            const targetMil = (calculatedTargetDist * REF_MIL) / REF_DIST;

            resEl.innerHTML = `${calculatedTargetDist.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} <span class="text-xs font-normal text-slate-400">m</span>`;
            milEl.innerHTML = `${Math.round(targetMil)} <span class="text-xs font-normal text-slate-400">mils</span>`;

            resEl.className = "text-lg md:text-xl font-bold font-mono text-emerald-400 truncate";
            stepEl.innerText = `√[(${dx.toFixed(2)})² + (${dy.toFixed(2)})²] × 100`;
            copyBtn.disabled = false;
            copyMilBtn.disabled = false;

            // Check if user specified a manual fired distance
            const manualFiredDist = parseFloat(document.getElementById(`fired-dist-${id}`).value);
            const baseFiredDist = !isNaN(manualFiredDist) ? manualFiredDist : calculatedTargetDist;

            // Arty Correction Logic
            if (currentMode === 'arty') {
                corrBox.classList.remove('hidden');
                const xi = parseFloat(document.getElementById(`xi-${id}`).value);
                const yi = parseFloat(document.getElementById(`yi-${id}`).value);

                if (isNaN(xi) || isNaN(yi)) {
                    corrDistEl.innerHTML = `<span class="text-xs text-slate-500 font-normal">กรอกพิกัดกระสุนตกเพื่อคำนวณ</span>`;
                    corrDirEl.innerHTML = ``;
                } else {
                    const dxi = x1 - xi;
                    const dyi = y1 - yi;
                    const impactDist = Math.sqrt(dxi * dxi + dyi * dyi) * 100;

                    const rangeDiff = calculatedTargetDist - impactDist; // Difference between target and impact
                    const correctedDist = baseFiredDist + rangeDiff; // Adjusted firing distance from base fired distance

                    const fmtBaseFired = baseFiredDist.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    const fmtCorrected = correctedDist.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                    const fmtDiff = Math.abs(rangeDiff).toFixed(2);

                    let rangeText = "";
                    if (Math.abs(rangeDiff) < 0.01) {
                        rangeText = `<span class="text-emerald-400">🎯 ระยะตรงเป้า (${fmtCorrected} m)</span>`;
                    } else if (rangeDiff > 0) {
                        rangeText = `<span class="text-amber-400">⬆️ เลื่อนขึ้น</span><br/><span class="text-[11px] font-mono text-slate-300 font-normal">${fmtBaseFired} + ${fmtDiff} = ${fmtCorrected} m</span>`;
                    } else {
                        rangeText = `<span class="text-cyan-400">⬇️ เลื่อนลง</span><br/><span class="text-[11px] font-mono text-slate-300 font-normal">${fmtBaseFired} - ${fmtDiff} = ${fmtCorrected} m</span>`;
                    }

                    const vTargetX = x2 - x1;
                    const vTargetY = y2 - y1;
                    const vImpactX = xi - x1;
                    const vImpactY = yi - y1;

                    const crossProduct = (vTargetX * vImpactY) - (vTargetY * vImpactX);

                    let dirText = "";
                    if (Math.abs(crossProduct) < 0.01) {
                        dirText = `<span class="text-emerald-400">🎯 ทิศทางตรงเป้า</span>`;
                    } else if (crossProduct > 0) {
                        dirText = `<span class="text-orange-400">➡️ ปรับไปทางขวา</span>`;
                    } else {
                        dirText = `<span class="text-orange-400">⬅️ ปรับไปทางซ้าย</span>`;
                    }

                    corrDistEl.innerHTML = rangeText;
                    corrDirEl.innerHTML = dirText;
                }
            } else {
                corrBox.classList.add('hidden');
            }
        }

        function calculateAll() {
            activeTargetIds.forEach(id => {
                calculateTarget(id);
            });
        }

        function copyResult(id) {
            const resText = document.getElementById(`result-${id}`).innerText.replace(/[^\d.]/g, '');
            navigator.clipboard.writeText(resText).then(() => {
                const label = document.getElementById(`copy-text-${id}`);
                label.innerText = "คัดลอกแล้ว!";
                setTimeout(() => {
                    label.innerText = "ก๊อประยะ";
                }, 1500);
            });
        }

        function copyMil(id) {
            const milText = document.getElementById(`mil-${id}`).innerText.replace(/[^\d.]/g, '');
            navigator.clipboard.writeText(milText).then(() => {
                const label = document.getElementById(`copy-mil-text-${id}`);
                label.innerText = "คัดลอกแล้ว!";
                setTimeout(() => {
                    label.innerText = "ก๊อป MIL";
                }, 1500);
            });
        }
    </script>
</body>
</html>
